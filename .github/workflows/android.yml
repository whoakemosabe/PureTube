name: Android

# Pushes to master publish a signed release (v1.0.N) with puretube.apk attached; other branches
# are build checks. Same pipeline as Skjálfti, Afli and Dropi.
# Tests and the release build run side by side on separate machines; the release only goes
# out when both pass, so a push waits for the slower of the two instead of both in a row.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse compiled pieces from earlier runs on every branch, not just master.
          cache-read-only: false
          # Also keeps Gradle's configuration cache between runs (it holds secrets, so it is
          # only saved encrypted). Without the secret this is skipped, nothing breaks.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          # The runner has 4 cores and 16 GB; use all of them.
          ./gradlew :app:testDebugUnitTest \
            --max-workers=4 -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" 2>&1 | tee build.log

      # GitHub keeps 10 error annotations per step, so errors are reported in batches.
      - name: Report errors (1-10)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|ERROR|expected:<|Exception at|FAILED$" build.log; grep -A 10 "What went wrong" build.log; } \
            | grep -v "^--$" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's#/home/runner/work/[^/]*/[^/]*/##' \
            | awk 'NF && !seen[$0]++' > errors.txt || true
          { echo '### Build errors'; echo '```'; head -200 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done

  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse compiled pieces from earlier runs on every branch, not just master.
          cache-read-only: false
          # Also keeps Gradle's configuration cache between runs (it holds secrets, so it is
          # only saved encrypted). Without the secret this is skipped, nothing breaks.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/master" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/puretube-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/puretube-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease \
            --max-workers=4 -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" 2>&1 | tee build.log

      # GitHub keeps 10 error annotations per step, so errors are reported in batches.
      - name: Report errors (1-10)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|ERROR|expected:<|Exception at|FAILED$" build.log; grep -A 10 "What went wrong" build.log; } \
            | grep -v "^--$" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's#/home/runner/work/[^/]*/[^/]*/##' \
            | awk 'NF && !seen[$0]++' > errors.txt || true
          { echo '### Build errors'; echo '```'; head -200 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk puretube.apk
          echo "::notice::APK $(( $(stat -c %s puretube.apk) / 1024 )) KB"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: puretube-apk
          path: puretube.apk
          retention-days: 14

  release:
    name: Publish release
    # Only master publishes, and only when the tests and the build both passed.
    needs: [test, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags, for the "What's new" list in the release notes.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: puretube-apk

      - name: Release notes
        run: |
          {
            echo "Tap **puretube.apk** below on your phone to install or update."
            echo
            # What's new: commit titles since the previous release tag.
            prev=$(git describe --tags --abbrev=0 --match 'v1.*' HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "### What's new since $prev"
              git log --no-merges --pretty='- %s' "$prev..HEAD" | head -25
              echo
            fi
            echo "Puretube — ad-free YouTube for Android. Built from ${GITHUB_SHA}."
          } > notes.md

      - name: Publish release
        # Uses the gh CLI on the runner, so there's no third-party action in the release path.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" puretube.apk \
            --title "Puretube 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            --latest

  lint:
    name: Lint report
    # Android's own checks, as a report only: never blocks or delays a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse compiled pieces from earlier runs on every branch, not just master.
          cache-read-only: false
          # Also keeps Gradle's configuration cache between runs (it holds secrets, so it is
          # only saved encrypted). Without the secret this is skipped, nothing breaks.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Lint report
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --max-workers=4 > /dev/null 2>&1 || true
          f=$(ls app/build/reports/lint-results-debug.txt app/build/reports/lint.txt 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "::warning::No lint report"; exit 0; }
          summary=$(grep -E '^[0-9]+ errors?, [0-9]+ warnings?' "$f" | tail -1)
          echo "::notice title=Lint::${summary:-No issues}"
          { echo '### Lint'; echo '```'; head -300 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
