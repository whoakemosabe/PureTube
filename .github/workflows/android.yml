name: Android

# Pushes to master publish a signed release (v4.0.N) with puretube.apk attached; other branches
# are build checks. Same pipeline as Skjálfti, Afli and Dropi.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags, for the "What's new" list in the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse compiled pieces from earlier runs on every branch, not just master.
          cache-read-only: false

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/master" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/puretube-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/puretube-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" 2>&1 | tee build.log

      # GitHub keeps 10 error annotations per step, so compile errors are reported in batches.
      - name: Report errors (1-10)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|ERROR|expected:<|Exception at|FAILED$" build.log; grep -A 10 "What went wrong" build.log; } \
            | grep -v "^--$" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's#/home/runner/work/[^/]*/[^/]*/##' \
            | awk 'NF && !seen[$0]++' > errors.txt || true
          { echo '### Build errors'; echo '```'; head -200 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk puretube.apk
          echo "::notice::APK $(( $(stat -c %s puretube.apk) / 1024 )) KB"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: puretube-apk
          path: puretube.apk
          retention-days: 14

      - name: Release notes
        run: |
          {
            echo "Tap **puretube.apk** below on your phone to install or update."
            echo
            # What's new: commit titles since the previous release tag.
            prev=$(git describe --tags --abbrev=0 --match 'v4.*' HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "### What's new since $prev"
              git log --no-merges --pretty='- %s' "$prev..HEAD" | head -25
              echo
            fi
            echo "Puretube — ad-free YouTube for Android. Built from ${GITHUB_SHA}."
          } > notes.md

      - name: Publish release
        # Only master publishes; other branches are build checks. Uses the gh CLI on the runner,
        # so there's no third-party action (or its Node version) in the release path.
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v4.0.${{ github.run_number }}" puretube.apk \
            --title "Puretube 4.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            --latest

      # After the release is out: Android's own checks, as a report only.
      - name: Lint report
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:lintDebug --max-workers=2 > /dev/null 2>&1 || true
          f=$(ls app/build/reports/lint-results-debug.txt app/build/reports/lint.txt 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "::warning::No lint report"; exit 0; }
          summary=$(grep -E '^[0-9]+ errors?, [0-9]+ warnings?' "$f" | tail -1)
          echo "::notice title=Lint::${summary:-No issues}"
          { echo '### Lint'; echo '```'; head -300 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
